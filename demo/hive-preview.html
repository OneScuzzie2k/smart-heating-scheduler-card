<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Heating — Hive-style working card preview</title>
<style>body{margin:0;background:#f3f4f5;color:#24272a;font:15px/1.5 system-ui,sans-serif}header{padding:20px;max-width:1000px;margin:auto}h1{font-size:23px;margin:0}p{color:#687279;margin:4px 0 14px}button{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #ddd;border-radius:10px;background:#fff;margin-right:8px;cursor:pointer}main{max-width:1000px;margin:auto;padding:0 16px 30px;box-sizing:border-box}.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px;margin:auto}.phone{max-width:390px}.phone .minis{grid-template-columns:1fr}.two .minis{grid-template-columns:repeat(2,minmax(0,1fr))!important}smart-heating-scheduler-card{display:block;min-width:0}@media(max-width:600px){.minis{grid-template-columns:1fr}header{padding:16px}button{font-size:13px}}</style>
<header><h1>Smart Heating</h1><p>Working card preview · sample data · disconnected from Home Assistant</p><button id="layout">Show mini cards</button><button id="phone">Phone layout</button><button id="theme">Dark theme</button><button id="compact">Two compact columns</button></header><main id="stage"><div id="cards"></div></main>
<script src="../dist/smart-heating-scheduler-card.js"></script><script>
let mini=false,dark=false;const root=document.getElementById('cards');
function draw(){root.className=mini?'minis':'';root.replaceChildren();for(let i=0;i<(mini?2:1);i++){const card=document.createElement('smart-heating-scheduler-card');root.append(card);card.setConfig({demo:true,theme:dark?'dark':'light',thermostat_style:'hive',layout:mini?'mini':'full',title:mini?['Bedroom Heating','Lounge Heating'][i]:'Heating Control'});if(mini)card._config.zone_id=card._data.zones[i].id;card._data.zones.forEach((z,index)=>{z.current_temperature=index?19:19.6;z.device_target=index?20:20.5;z.mode='heat';z.hvac_action='heating';z.source='schedule';z.receiver={schedule_owner:'receiver',ownership:{state:'active',hardware:{mode:'schedule'}}};});card._render();}}
document.getElementById('compact').onclick=()=>document.getElementById('stage').classList.toggle('two');document.getElementById('layout').onclick=e=>{mini=!mini;e.target.textContent=mini?'Show full scheduler':'Show mini cards';draw();};document.getElementById('phone').onclick=()=>document.getElementById('stage').classList.toggle('phone');document.getElementById('theme').onclick=e=>{dark=!dark;e.target.textContent=dark?'Light theme':'Dark theme';draw();};draw();
</script></html>
