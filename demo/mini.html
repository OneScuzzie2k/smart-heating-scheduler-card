<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Heating Cards — preview</title><style>
body{margin:0;font:14px 'Segoe UI',sans-serif;background:#eaf0f4;color:#233845}main{max-width:660px;margin:28px auto;padding:16px}h1{font-size:23px;margin:0 0 8px}p{color:#57707f;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools button{min-height:44px;padding:9px 16px;background:white;border:1px solid #bacbd6;border-radius:12px;color:#233845;cursor:pointer}.tools button:focus-visible{outline:3px solid #00838f}.phone .cards{grid-template-columns:1fr;max-width:390px;margin:auto}.dark{background:#0a131c;color:#eff5fa}.dark p{color:#b2c6d3}@media(max-width:550px){main{margin:8px auto}.cards{grid-template-columns:1fr}}
</style></head><body><main><h1>Mini heating cards</h1><p>Disconnected preview · sample data only. Drag the round thermostat handle or tap its arc to change temperature. No Home Assistant connection or heating commands.</p><div class="tools"><button id="theme">Switch theme</button><button id="size">Desktop / phone layout</button></div><div class="cards"><smart-heating-scheduler-card id="bedroom"></smart-heating-scheduler-card><smart-heating-scheduler-card id="lounge"></smart-heating-scheduler-card></div></main><script src="/card.js"></script><script>
let theme='light';const cards=[['bedroom','Bedroom Heating'],['lounge','Lounge Heating']];function configure(){for(const[id,title]of cards)document.getElementById(id).setConfig({demo:true,layout:'mini',zone_id:id,title,theme,dashboard_path:'/'});}configure();document.getElementById('theme').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.classList.toggle('dark',theme==='dark');configure();};document.getElementById('size').onclick=()=>document.body.classList.toggle('phone');
</script></body></html>
